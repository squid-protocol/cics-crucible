name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: schema and cross-reference validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every case
        run: python3 tools/validate.py

  syntax:
    name: GnuCOBOL syntax check (EXEC CICS stubbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3 || sudo apt-get install -y gnucobol
          cobc --version | head -1
      - name: Compile every program
        run: python3 tools/syntax_check.py
